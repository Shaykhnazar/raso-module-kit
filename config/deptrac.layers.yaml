# ŞABLON — modul repolariga NUSXA KO'CHIRILADI (`raso:module:init` shuni qo'yadi).
#
# O'LCHOV A — QATLAMLAR (har context ichida).
# Domain → faqat SharedKernel. Application → Domain + Contracts.
# Infrastructure/Presentation → hammasi.
#
# MUHIM: deptrac bitta konfigda bitta o'lchovni tekshiradi. Context chegaralari
# alohida faylda: `deptrac.contexts.yaml`. Ikkalasi ham `composer deptrac` da ishlaydi.
# SharedKernel generic kollektorlardan chiqarib tashlangan — aks holda bitta klass
# ikki qatlamga tushib, qoidalar to'qnashadi.
deptrac:
  paths:
    - ./src

  layers:
    - name: SharedKernel
      collectors:
        - type: directory
          value: 'src/SharedKernel/.*'

    - name: Domain
      collectors:
        - type: bool
          must:
            - type: directory
              value: 'src/.*/Domain/.*'
          must_not:
            - type: directory
              value: 'src/SharedKernel/.*'

    - name: Application
      collectors:
        - type: bool
          must:
            - type: directory
              value: 'src/.*/Application/.*'
          must_not:
            - type: directory
              value: 'src/SharedKernel/.*'

    - name: Infrastructure
      collectors:
        - type: bool
          must:
            - type: directory
              value: 'src/.*/Infrastructure/.*'
          must_not:
            - type: directory
              value: 'src/SharedKernel/.*'

    - name: Presentation
      collectors:
        - type: bool
          must:
            - type: directory
              value: 'src/.*/Presentation/.*'
          must_not:
            - type: directory
              value: 'src/SharedKernel/.*'

    - name: Contracts
      collectors:
        - type: bool
          must:
            - type: directory
              value: 'src/.*/Contracts/.*'
          must_not:
            - type: directory
              value: 'src/SharedKernel/.*'

  ruleset:
    # Domain — sof PHP, faqat SharedKernel'ga suyanadi (Octane memory-safe).
    Domain:
      - SharedKernel
    # Application — orkestratsiya: o'z Domain + Contracts.
    Application:
      - Domain
      - Contracts
      - SharedKernel
    # Infrastructure/Presentation — ichkariga qaray oladi.
    Infrastructure:
      - Domain
      - Application
      - Contracts
      - SharedKernel
    Presentation:
      - Domain
      - Application
      - Contracts
      - SharedKernel
    Contracts:
      - SharedKernel
    SharedKernel: ~
